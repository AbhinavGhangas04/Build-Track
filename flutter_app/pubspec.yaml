name: buildtrack_pro
description: BuildTrack Pro - Complete Contractor Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Camera & Image
  camera: ^0.10.5+7
  image_picker: ^1.0.7
  image_cropper: ^5.0.1
  
  # OCR
  google_mlkit_text_recognition: ^0.11.0
  
  # File Handling
  path_provider: ^2.1.2
  open_file: ^3.3.2
  file_picker: ^6.1.1
  
  # Excel Export
  excel: ^4.0.3
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Date & Time
  intl: ^0.18.1
  table_calendar: ^3.0.9
  
  # Form Validation
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0
  
  # Animations
  animations: ^2.0.11
  lottie: ^3.0.0
  
  # Utilities
  uuid: ^4.3.3
  url_launcher: ^6.2.3
  share_plus: ^7.2.1
  
  # Maps & Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # Notifications
  flutter_local_notifications: ^16.3.2
  
  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
